name: cannery

on:
  push:
    branches:
      - '**'
    branches-ignore:
      - weblate
  pull_request:
  create:
    tags:
      - '*'

jobs:
  test:
    runs-on: docker
    container:
      image: elixir:1.19.5-otp-28-alpine
    services:
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
    env:
      TEST_DATABASE_URL: ecto://postgres:postgres@database/cannery_test
      HOST: testing.example.tld
      MIX_HOME: /workspace/.mix
      MIX_ARCHIVES: /workspace/.mix/archives
      MIX_ENV: test
    steps:
      - name: Install system dependencies
        run: apk add --no-cache build-base npm git nodejs

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            _build
            deps
            .npm
            .mix
          key: mix-${{ hashFiles('mix.lock', 'assets/package-lock.json') }}
          restore-keys: mix-

      - name: Install Elixir dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Install Node dependencies
        run: |
          npm set cache .npm
          npm --prefix ./assets ci --no-audit --prefer-offline

      - name: Compile and build assets
        run: mix do phx.digest, gettext.extract, assets.deploy

      - name: Run tests
        run: mix test.all

  publish-stable:
    needs: test
    if: github.ref == 'refs/heads/stable'
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Checkout
        run: |
          apk add --no-cache git
          git clone --depth 1 --branch ${GITHUB_REF_NAME} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git .

      - name: Set up QEMU and Buildx
        run: |
          docker run --rm --privileged tonistiigi/binfmt --install all
          docker buildx create --use --driver docker-container --driver-opt network=host --name multiarch

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push
        run: docker buildx build --push --platform linux/amd64,linux/arm64 -t shibaobun/cannery:latest .

  publish-dev:
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Checkout
        run: |
          apk add --no-cache git
          git clone --depth 1 --branch ${GITHUB_REF_NAME} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git .

      - name: Set up QEMU and Buildx
        run: |
          docker run --rm --privileged tonistiigi/binfmt --install all
          docker buildx create --use --driver docker-container --driver-opt network=host --name multiarch

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push
        run: docker buildx build --push --platform linux/amd64,linux/arm64 -t shibaobun/cannery:dev .

  publish-tag:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Checkout
        run: |
          apk add --no-cache git
          git clone --depth 1 --branch ${GITHUB_REF_NAME} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git .

      - name: Set up QEMU and Buildx
        run: |
          docker run --rm --privileged tonistiigi/binfmt --install all
          docker buildx create --use --driver docker-container --driver-opt network=host --name multiarch

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push
        run: docker buildx build --push --platform linux/amd64,linux/arm64 -t shibaobun/cannery:${{ github.ref_name }} .
