name: cannery

services:
  cannery:
    build:
      context: .
      dockerfile: Dockerfile
    image: cannery:local
    container_name: cannery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-ecto://postgres:postgres@cannery-db/cannery}
      HOST: ${HOST:-localhost}
      PORT: ${PORT:-4000}
    depends_on:
      cannery-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${PORT:-4000}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:${PORT:-4000}:4000"

  cannery-db:
    image: postgres:17-alpine
    container_name: cannery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cannery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - cannery-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cannery}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  cannery-db-data:
